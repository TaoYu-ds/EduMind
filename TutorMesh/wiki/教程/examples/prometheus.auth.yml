global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tutormesh
    environment: production

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: tutormesh-app
    static_configs:
      - targets: ["tutormesh:8000"]
        labels:
          service: tutormesh
    scrape_interval: 10s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/tutormesh_metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
