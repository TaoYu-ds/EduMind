# Prometheus 配置文件 — TutorMesh 智学助手（教育培训场景）

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'tutormesh'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # TutorMesh 主应用指标
  - job_name: 'tutormesh-app'
    static_configs:
      - targets: ['tutormesh:8000']
        labels:
          service: 'tutormesh'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
