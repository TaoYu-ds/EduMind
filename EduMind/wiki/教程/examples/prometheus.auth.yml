global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: edumind
    environment: production

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: edumind-app
    static_configs:
      - targets: ["edumind:8000"]
        labels:
          service: edumind
    scrape_interval: 10s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/edumind_metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
